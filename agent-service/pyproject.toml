[project]
name = "agent-service"
version = "0.1.0"
description = "FastAPI research service with planning, web search and cited reports"
readme = "README.md"
authors = [
    { name = "Luananwei", email = "2403_88190568@noreply.gitcode.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "openai-agents>=0.23.1",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "redis>=6.4,<9",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
]
